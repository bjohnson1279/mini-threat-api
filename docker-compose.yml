services:
  db:
    image: postgres:16-alpine
    container_name: threat_intel_postgres
    restart: always
    environment:
      POSTGRES_USER: threat_admin
      POSTGRES_PASSWORD: threat_password123
      POSTGRES_DB: threat_intel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_admin -d threat_intel_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: threat_intel_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://threat_admin:threat_password123@db:5432/threat_intel_db
      - JWT_SECRET_KEY=dev_secret_threat_intel_key_1234567890abcdef
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
